name: Build Android APK

# 打 v* 标签时构建 Android APK 并上传到对应 Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ubuntu-latest 已预装 Android SDK 与 platform-tools，无需 setup-android action
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          ls "$ANDROID_HOME/platforms" 2>/dev/null | head -5 || true
          which sdkmanager || true

      # 关键：固定 debug 签名，否则每次 CI 重新生成 ~/.android/debug.keystore，
      # 用户安装新 APK 时会因签名不同被系统要求先卸载（卸载就意味着数据丢失）。
      # 原先用 actions/cache 存密钥，但按 tag 触发的运行彼此不共享缓存作用域，
      # 缓存形同虚设、每版签名都不同。改用仓库 Secrets 存放固定密钥（长期有效）。
      - name: Restore stable Android debug keystore (from Secrets)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "已恢复固定签名密钥（Secrets）"
          else
            echo "::warning::未配置 ANDROID_DEBUG_KEYSTORE_B64，本次构建将使用临时密钥，APK 无法覆盖安装上一版"
          fi

      - name: Install root deps & build web
        run: |
          npm ci
          npm run build
          ls -la dist/

      - name: Install Capacitor deps
        working-directory: android
        run: npm ci

      - name: Generate Android native project
        working-directory: android
        run: |
          npx cap add android --yes 2>&1 || npx cap add android 2>&1 || true
          npx cap sync android 2>&1
          echo "=== android dir ==="
          ls -la android/ 2>/dev/null || echo "no nested android dir"
          echo "=== gradlew location ==="
          find . -name gradlew -type f | head -5

      - name: Align Android version with release tag
        run: |
          GRADLE=$(find android -path "*/app/build.gradle" -type f | head -1)
          if [ -z "$GRADLE" ]; then echo "app/build.gradle not found"; exit 1; fi
          python3 assets/inject-android-version.py "$GRADLE" "${{ github.ref_name }}"

      - name: Inject media permissions
        run: |
          MANIFEST=$(find android -path "*/app/src/main/AndroidManifest.xml" | head -1)
          if [ -z "$MANIFEST" ]; then echo "manifest not found"; exit 1; fi
          echo "Manifest: $MANIFEST"
          python3 assets/inject-android-permissions.py "$MANIFEST"

      - name: Apply unified app icon
        run: |
          # 全平台统一图标（与 Web/桌面同源 assets/app-icon.svg）
          ICONS="assets/android-icons"
          # cap add 生成的项目可能在 android/android 或 android/ 下，自动定位 res 目录
          RES=$(find android -type d -path "*/app/src/main/res" | head -1)
          if [ -z "$RES" ]; then echo "res dir not found"; exit 1; fi
          echo "Using res dir: $RES"
          for den in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "$RES/mipmap-$den"
            cp "$ICONS/mipmap-$den-ic_launcher.png" "$RES/mipmap-$den/ic_launcher.png"
            cp "$ICONS/mipmap-$den-ic_launcher_round.png" "$RES/mipmap-$den/ic_launcher_round.png"
          done
          # Capacitor 默认生成 adaptive icon（mipmap-anydpi-v26/ic_launcher.xml 引用
          # ic_launcher_foreground/background），会覆盖上面的传统 PNG。删除该目录与
          # 前景/背景资源，强制系统回退到我们替换的 ic_launcher.png，确保统一图标生效。
          rm -rf "$RES/mipmap-anydpi-v26"
          find "$RES" -type f \( -name "ic_launcher_foreground.xml" -o -name "ic_launcher_background.xml" -o -name "ic_launcher_foreground.png" \) -delete
          # 移除 AndroidManifest 的 roundIcon 属性（圆形图标我们已提供，保留也无妨，
          # 但部分启动器仍优先 adaptive，这里统一让 launcher 用 ic_launcher）
          MANIFEST=$(find android -path "*/app/src/main/AndroidManifest.xml" | head -1)
          if [ -n "$MANIFEST" ]; then
            sed -i 's/ android:roundIcon="[^"]*"//g' "$MANIFEST" || true
          fi
          echo "统一图标已应用（已移除 adaptive icon 覆盖）"

      - name: Build debug APK
        working-directory: android
        run: |
          GRADLEW=$(find . -name gradlew -type f | head -1)
          if [ -z "$GRADLEW" ]; then echo "gradlew not found"; exit 1; fi
          chmod +x "$GRADLEW"
          GRADLE_DIR=$(dirname "$GRADLEW")
          cd "$GRADLE_DIR" && ./gradlew assembleDebug --no-daemon 2>&1 | tail -30

      - name: Locate APK
        id: apk
        run: |
          APK=$(find . -name "*.apk" -type f | grep -i debug | head -1)
          if [ -z "$APK" ]; then echo "No APK produced"; exit 1; fi
          echo "path=$APK" >> $GITHUB_OUTPUT
          ls -lh "$APK"

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: false
