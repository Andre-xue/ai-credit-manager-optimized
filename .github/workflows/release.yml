name: Release Installers

# 打 v* 标签时触发：为各平台编译安装包并发布到 GitHub Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # v0.1.495 起的发版硬闸：新版本号必须严格大于最新已发布 release 的版本号，
  # 否则整个发布直接失败（2026-11-27 小号晚发导致更新器误报「已是最新」的教训）。
  # 发版清单同步注明：打 tag 前先确认 package.json 版本号 > GitHub 最新 release。
  version-guard:
    name: Version monotonic guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: New version must be strictly greater than latest published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            NEW="${GITHUB_REF_NAME#v}"
          else
            NEW=$(node -p "require('./package.json').version")
          fi
          echo "待发布版本: $NEW"
          TAGS=$(gh api --paginate "repos/${{ github.repository }}/releases?per_page=100" --jq '.[] | select(.draft == false) | .tag_name')
          echo "已发布 tag 数: $(printf '%s' "$TAGS" | grep -c . || true)"
          node scripts/check-version-monotonic.mjs "$NEW" $TAGS

  build-desktop:
    name: Build ${{ matrix.name }}
    needs: version-guard
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS-arm64
            os: macos-latest
            bundles: "app,dmg"
          - name: Windows-x64
            os: windows-latest
            bundles: "msi,nsis"
          - name: Linux-x64
            os: ubuntu-22.04
            bundles: "appimage,deb"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca

      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: 'desktop/src-tauri -> target'

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y webkit2gtk-4.1 libayatana-appindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      # 关键：Cargo.toml 的 version 决定安装包实际版本号（MSI/macOS CFBundle）。
      # 必须随 tag 同步，否则安装包版本永远 0.1.0，Windows/macOS 无法覆盖安装旧版。
      - name: Sync version from tag
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          echo "构建版本: $V"
          node -e "const fs=require('fs');const p='desktop/src-tauri/Cargo.toml';let s=fs.readFileSync(p,'utf8');s=s.replace(/^version\s*=\s*\"[^\"]+\"/m,'version = \"$V\"');fs.writeFileSync(p,s)"
          node -e "const fs=require('fs');const p='desktop/src-tauri/tauri.conf.json';const d=JSON.parse(fs.readFileSync(p,'utf8'));d.version='$V';fs.writeFileSync(p,JSON.stringify(d,null,2)+'\n')"

      # v0.1.285 起：签名密钥缺失直接终止构建。历史上该密钥长期未配置、此步只发警告，
      # 结果一百多版都没有签名更新产物、自动更新静默失效——拒绝再重演。
      - name: Prepare updater config
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY 未配置，终止构建（无签名更新包的版本不允许发布）"
            exit 1
          fi
          echo "updater 签名密钥已配置，将生成签名更新产物"

      # v0.1.453：可选的固定自签身份，让 macOS TCC（辅助功能/录屏）的 designated
      # requirement 跨版本稳定、授权不随更新失效。此前构建是 ad-hoc 签名，cdhash
      # 每版都变，TCC 按 cdhash 认人——这正是翻译助手授权「装新版就丢」的根源。
      # 仓库 secrets 配齐 APPLE_CERTIFICATE（自签 .p12 的 base64 单行）/
      # APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY 才启用；未配则保持
      # ad-hoc，行为与之前完全一致。注意：身份切换后的第一个版本，旧授权会
      # 最后失效一次（requirement 从 cdhash 变为证书），之后跨版本保留。
      # v0.1.449 补修（第三关，真根因以 tauri-macos-sign 2.12.5 源码为准）：
      # Tauri 的 with_certificate 路径（传 APPLE_CERTIFICATE 时走）解析身份不用
      # find-identity，而是拿一组写死的 Apple 证书名前缀（"Developer ID
      # Application:"、"Apple Development:" 等九个）逐个 find-certificate，
      # 还要求证书 subject 带 OU 字段——自签证书名不带 Apple 前缀、也没有 OU，
      # 永远匹配不上，必然报 "failed to resolve signing identity"（与信任无关，
      # 补信任实测无效即此因）。唯一活路是 with_signing_identity 路径：只传
      # APPLE_SIGNING_IDENTITY、不传证书/密码，Tauri 直接 codesign -s "身份名"
      # 在钥匙串搜索列表里按名匹配。故下方步骤自建构建钥匙串导入证书、设分区
      # 授权、补信任（让 find-identity -v 认它、codesign 匹配更稳），只把身份
      # 名写进 GITHUB_ENV，证书与密码绝不传给 Tauri。
      - name: Prepare macOS fixed signing identity (optional)
        if: runner.os == 'macOS'
        shell: bash
        env:
          ACM_APPLE_CERT_B64: ${{ secrets.APPLE_CERTIFICATE }}
          ACM_APPLE_CERT_PWD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          ACM_APPLE_SIGN_ID: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -n "$ACM_APPLE_CERT_B64" ] && [ -n "$ACM_APPLE_CERT_PWD" ] && [ -n "$ACM_APPLE_SIGN_ID" ]; then
            # 只传身份名：APPLE_CERTIFICATE/PASSWORD 一旦出现，Tauri 就走
            # with_certificate 死路（只认 Apple 前缀证书名），见上方注释。
            echo "APPLE_SIGNING_IDENTITY=$ACM_APPLE_SIGN_ID" >> "$GITHUB_ENV"
            echo "已启用固定签名身份：$ACM_APPLE_SIGN_ID"

            # --- 补齐信任：自建构建钥匙串导入同一证书 + 分区授权 + add-trusted-cert ---
            KC="$RUNNER_TEMP/acm-signing.keychain-db"
            KC_PWD="acm-ci-$RANDOM$RANDOM"
            P12="$RUNNER_TEMP/acm-signing.p12"
            CERT_PEM="$RUNNER_TEMP/acm-signing-cert.pem"
            # 硬超时包装（perl alarm；macOS 无 GNU timeout）：security 家族命令
            # 在 CI 里可能因图形授权弹窗无限挂起，凡有此风险的调用都经它执行。
            acm_timeout() { perl -e 'alarm shift; exec @ARGV' "$@"; }
            echo "$ACM_APPLE_CERT_B64" | base64 -D > "$P12"
            security create-keychain -p "$KC_PWD" "$KC"
            security unlock-keychain -p "$KC_PWD" "$KC"
            security set-keychain-settings -lut 3600 "$KC"
            KCS=()
            while IFS= read -r line; do
              line="${line//\"/}"
              line="${line#"${line%%[! ]*}"}"
              if [ -n "$line" ]; then KCS+=("$line"); fi
            done < <(security list-keychains -d user)
            security list-keychains -d user -s "$KC" "${KCS[@]}"
            acm_timeout 60 security import "$P12" -k "$KC" -P "$ACM_APPLE_CERT_PWD" -T /usr/bin/codesign
            rm -f "$P12"
            acm_timeout 60 security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PWD" "$KC"
            security find-certificate -a -c "$ACM_APPLE_SIGN_ID" -p "$KC" > "$CERT_PEM"
            # 信任逐级补，每步后用 find-identity -v 实测身份名是否逐字命中 valid
            # 列表。顺序要点（首跑实测教训）：用户域 add-trusted-cert 在 CI 里会
            # 触发 SecurityAgent 图形授权弹窗、无人可点而无限挂起，故 Admin 域
            # （sudo、root 执行不弹窗）优先，用户域两个变体垫后。所有调用已套
            # 上面的硬超时，单级卡住最多等 60 秒就跳下一级，绝不再挂死整个 job。
            acm_identity_valid() { security find-identity -v -p codesigning | grep -Fq "$ACM_APPLE_SIGN_ID"; }
            acm_timeout 60 sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$CERT_PEM" || true
            if ! acm_identity_valid; then
              acm_timeout 60 security add-trusted-cert -r trustRoot -p codeSign -k "$KC" "$CERT_PEM" || true
            fi
            if ! acm_identity_valid; then
              acm_timeout 60 security add-trusted-cert -r trustRoot -p codeSign "$CERT_PEM" || true
            fi
            echo "--- 诊断：security find-identity -v -p codesigning（仅 valid） ---"
            security find-identity -v -p codesigning || true
            echo "--- 诊断：security find-identity -p codesigning（全部，含未受信任） ---"
            security find-identity -p codesigning || true
            if security find-identity -v -p codesigning | grep -Fq "$ACM_APPLE_SIGN_ID"; then
              echo "签名身份校验：APPLE_SIGNING_IDENTITY 已在 valid 列表中（名称逐字匹配）"
            else
              echo "::warning::签名身份仍不在 valid 列表中，Tauri 可能仍会报 failed to resolve signing identity，请看上方诊断输出"
            fi
          else
            echo "未配置固定签名身份 secrets，本次仍为 ad-hoc 签名（macOS TCC 授权不跨版本保留）"
          fi

      - name: Install Tauri CLI & build installer
        working-directory: desktop
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          npm ci
          npx tauri build --bundles "${{ matrix.bundles }}" 2>&1 | tee build.log
          # macOS 新版 hdiutil 与 Tauri dmg 脚本不兼容时，用 app 手动生成 dmg
          if [[ "${{ runner.os }}" == "macOS" ]] && ! ls src-tauri/target/release/bundle/dmg/*.dmg >/dev/null 2>&1; then
            echo "Tauri dmg failed, creating dmg manually..."
            STAGE=/tmp/acm-dmg-stage && rm -rf "$STAGE" && mkdir -p "$STAGE"
            cp -R "src-tauri/target/release/bundle/macos/AI Cube.app" "$STAGE/"
            ln -s /Applications "$STAGE/Applications"
            hdiutil create -volname "AI 魔方" -srcfolder "$STAGE" -ov -format UDZO \
              "src-tauri/target/release/bundle/dmg/AI Cube_${{ github.ref_name }}_${{ matrix.name }}.dmg"
          fi

      - name: List built artifacts
        working-directory: desktop
        shell: bash
        run: find src-tauri/target/release/bundle -type f \( -name "*.dmg" -o -name "*.app" -o -name "*.msi" -o -name "*.exe" -o -name "*.AppImage" -o -name "*.deb" \) | head -20

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.name }}
          path: |
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/dmg/*.dmg.sig
            desktop/src-tauri/target/release/bundle/macos/*.app/**
            desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz
            desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/msi/*.msi.sig
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/nsis/*.exe.sig
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage.sig
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/deb/*.deb.sig
          if-no-files-found: warn

  create-release:
    name: Publish Release
    needs: build-desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release-files
          find artifacts -type f | while read f; do
            # 展平目录，文件名加平台前缀避免冲突
            base=$(basename "$f")
            # 关键：把文件名里的空格替换成点号。GitHub Release 上传会把空格规范化为点号，
            # 若 latest.json 里保留空格，下载 URL 会 404，导致桌面端静默更新永远失败。
            base=${base// /\.}
            platform=$(echo "$f" | cut -d/ -f2 | sed 's/installer-//')
            cp "$f" "release-files/${platform}-${base}"
          done
          find release-files -type f -exec ls -lh {} \;

      - name: Generate updater latest.json
        run: |
          if python3 assets/make-latest-json.py release-files latest.json "${{ github.ref_name }}" "${{ github.repository }}"; then
            echo "HAS_UPDATER=true" >> $GITHUB_ENV
            cp latest.json release-files/latest.json
          else
            echo "HAS_UPDATER=false" >> $GITHUB_ENV
            echo "No signed artifacts; skipping latest.json (updater unavailable this release)"
          fi

      - name: Generate SHA256SUMS
        run: |
          cd release-files
          find . -type f ! -name "SHA256SUMS.txt" -exec sha256sum {} + | sed 's| \./|  |' > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release with assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ github.ref_name }}
          files: release-files/*
          generate_release_notes: true
          body: |
            ## AI 魔方 ${{ github.ref_name }}

            本地优先的 AI 平台积分/额度管理工具。所有数据保存在你的设备，不上传。

            ### 各平台安装包
            | 系统 | 文件 | 说明 |
            |------|------|------|
            | macOS (Apple Silicon) | `macOS-arm64-*.dmg` | M1/M2/M3/M4 芯片 |
            | macOS (Intel) | `macOS-intel-*.dmg` | Intel 芯片 Mac |
            | Windows | `Windows-x64-*.msi` 或 `.exe` | 64 位 Windows |
            | Linux | `Linux-x64-*.AppImage` 或 `.deb` | 64 位 Linux |

            ### 其他使用方式
            - **Web / Docker**：见 [README](https://github.com/${{ github.repository }}/blob/main/README.md)
            - **微信小程序**：用微信开发者工具导入 `miniapp/` 目录

            > macOS 首次打开若提示"无法验证开发者"：右键 App →「打开」→ 弹窗点「打开」（需签名公证才能消除，见 README）。
