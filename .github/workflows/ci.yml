name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Type check & build
        run: npm run build

      - name: Validate miniapp syntax
        run: |
          for f in miniapp/app.js miniapp/utils/providers.js \
                   miniapp/pages/index/index.js miniapp/pages/detail/detail.js \
                   miniapp/pages/settings/settings.js; do
            node --check "$f"
          done
          echo "Miniapp JS syntax OK"

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t ai-credit-manager:ci .
      - name: Smoke test container
        run: |
          docker run -d --name acm-test -p 8080:80 ai-credit-manager:ci
          sleep 5
          curl -f http://localhost:8080/health
          curl -f http://localhost:8080/ > /dev/null
          docker rm -f acm-test

  # v0.1.447 新增：真 Rust TLS 集成测试（tests/mail_tls_integration.rs）。
  # 436/445 的无头验收全靠前端 stub，从未跑过真 TLS，导致 rustls
  # CryptoProvider 未安装的总根源漏网。本 job 用 App 自身的 mail_imap
  # 连接代码对本地假 TLS IMAP 服务器完成握手+LOGIN+CAPABILITY，
  # 此后每个版本都会被它守住。
  rust-mail-tls:
    name: Rust mail TLS integration test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y webkit2gtk-4.1 libayatana-appindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca

      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: 'desktop/src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend (tauri-build 需要 frontendDist)
        run: npm run build

      - name: Run mail TLS integration test
        working-directory: desktop/src-tauri
        run: cargo test --test mail_tls_integration -- --nocapture
