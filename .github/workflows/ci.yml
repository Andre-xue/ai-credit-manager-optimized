name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Type check & build
        run: npm run build

      - name: Validate miniapp syntax
        run: |
          for f in miniapp/app.js miniapp/utils/providers.js \
                   miniapp/pages/index/index.js miniapp/pages/detail/detail.js \
                   miniapp/pages/settings/settings.js; do
            node --check "$f"
          done
          echo "Miniapp JS syntax OK"

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t ai-credit-manager:ci .
      - name: Smoke test container
        run: |
          docker run -d --name acm-test -p 8080:80 ai-credit-manager:ci
          sleep 5
          curl -f http://localhost:8080/health
          curl -f http://localhost:8080/ > /dev/null
          docker rm -f acm-test

  # v0.1.447 新增：真 Rust TLS 集成测试（tests/mail_tls_integration.rs）。
  # 436/445 的无头验收全靠前端 stub，从未跑过真 TLS，导致 rustls
  # CryptoProvider 未安装的总根源漏网。本 job 用 App 自身的 mail_imap
  # 连接代码对本地假 TLS IMAP 服务器完成握手+LOGIN+CAPABILITY，
  # 此后每个版本都会被它守住。
  rust-mail-tls:
    name: Rust mail TLS integration test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y webkit2gtk-4.1 libayatana-appindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca

      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: 'desktop/src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend (tauri-build 需要 frontendDist)
        run: npm run build

      # tauri-build 的 feature/allowlist 校验：macos-private-api 特征要求配置里有
      # app.macOSPrivateApi=true——正式构建时由 Tauri CLI 注入合并配置，
      # 裸 cargo test 没有 CLI，这里在 CI 工作区内补上同一项（不提交回仓库）。
      - name: Inject macOSPrivateApi for plain cargo build
        run: |
          python3 - <<'EOF'
          import json
          p = 'desktop/src-tauri/tauri.conf.json'
          d = json.load(open(p))
          d.setdefault('app', {})['macOSPrivateApi'] = True
          json.dump(d, open(p, 'w'), indent=2)
          print('macOSPrivateApi injected for cargo test build')
          EOF

      - name: Run mail TLS integration test
        working-directory: desktop/src-tauri
        run: cargo test --test mail_tls_integration -- --nocapture

  # v0.1.462 新增：翻译助手 macOS 预检 FFI 集成测试
  # （tests/translator_ffi_integration.rs）。Ethan 实机点开翻译助手整个 App
  # 闪退，而打开翻译页才会走的原生代码只有 translator_permissions 命令里
  # 的预检 FFI（453 加的 ax_trusted_opts / screen_names_visible 从未在真机
  # 被证实跑通，无头 stub 验不到）。本 job 在 macOS（arm64，与 Ethan 的 M1
  # 同架构）runner 上进程内逐个真跑这批 FFI：哪个段错误，测试进程就死在
  # 哪个测试上。此后每个版本都会被它守住。runner 用 macos-latest（与
  # release.yml 的 macOS 构建同款 arm64 镜像；macos-14 标签在本仓库的
  # runner 配置下不可用，首跑 1 秒被拒）。
  rust-translator-ffi:
    name: Rust translator FFI test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca

      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: 'desktop/src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend (tauri-build 需要 frontendDist)
        run: npm run build

      # 与 rust-mail-tls 同款：裸 cargo test 没有 Tauri CLI 注入的合并配置，
      # macos-private-api 特征校验需要这一项，在 CI 工作区内补上（不提交回仓库）。
      - name: Inject macOSPrivateApi for plain cargo build
        run: |
          python3 - <<'EOF'
          import json
          p = 'desktop/src-tauri/tauri.conf.json'
          d = json.load(open(p))
          d.setdefault('app', {})['macOSPrivateApi'] = True
          json.dump(d, open(p, 'w'), indent=2)
          print('macOSPrivateApi injected for cargo test build')
          EOF

      - name: Run translator FFI integration test
        working-directory: desktop/src-tauri
        run: cargo test --test translator_ffi_integration -- --nocapture --test-threads=1
