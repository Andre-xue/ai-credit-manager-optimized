[package]
name = "ai-credit-manager"
version = "0.1.171"
description = "AI 积分管家 - 桌面端"
authors = ["you"]
edition = "2021"

[lib]
name = "ai_credit_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# 仅测试用（不进正式二进制）：mail_tls_integration 集成测试需要 tokio 宏与运行时。
[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
sha2 = "0.10"
tokio = { version = "1", features = ["time", "net", "io-util", "sync"] }
tokio-rustls = "0.26"
# v0.1.447：显式启用 ring feature——ring 本就在依赖树里（零新增体积），
# 保证 rustls::crypto::ring 提供者被编译进来，供启动时 install_default。
rustls = { version = "0.23", features = ["ring"] }
webpki-roots = "1"
base64 = "0.21"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"

# 火山端到端实时语音桥接骨架（cpal/tokio-tungstenite 等依赖未接入编译）：
# 当前构建环境无法从 crates.io 下载新依赖，待联网后按 volc_realtime.rs 顶部说明启用。
